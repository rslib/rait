[workspace]
members = ["crates/rait", "crates/rait-archive", "crates/rait-core", "crates/rait-document", "crates/rait-image", "crates/rait-media", "crates/rait-pdf", "crates/rait-table"]
resolver = "3"
exclude = ["vendor"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
tempfile = "3.14"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[patch.crates-io]
sevenz-rust2 = { path = "vendor/sevenz-rust2" }
