[package]
name = "rait-table"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
calamine = { version = "0.36", features = ["dates"] }
csv = "1.4"
parquet = { version = "60", default-features = false, features = ["json", "snap", "brotli", "flate2-zlib-rs", "lz4", "zstd"] }
rait-core = { path = "../rait-core" }
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[dev-dependencies.serde_json]
workspace = true
